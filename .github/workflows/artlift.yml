name: ArtLift Bot (Bluesky)

on:
  schedule:
    # Morning Brussels support window.
    - cron: "17 6,7,8,9 * * *"
    # Evening Brussels support window.
    - cron: "41 17,18,19,20 * * *"
  workflow_dispatch:

concurrency:
  group: artlift-bot-bsky
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore ArtLift state
        uses: actions/cache/restore@v4
        with:
          path: .artlift
          key: artlift-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            artlift-state-${{ github.ref_name }}-
            artlift-state-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Prepare state directory
        run: mkdir -p .artlift

      - name: Anti-burst jitter
        run: sleep $((RANDOM % 90))

      - name: Run ArtLift Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          ARTLIFT_STATE_PATH: .artlift/state.json
        run: python main.py

      - name: Save ArtLift state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .artlift
          key: artlift-state-${{ github.ref_name }}-${{ github.run_id }}
